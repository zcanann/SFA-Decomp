extract:
- symbol: gLoadingScreenTextures
  binary: gLoadingScreenTextures.bin
  header: gLoadingScreenTextures.inc

force_active:
  # aram_data.c: retain the same unreferenced 24-byte .bss block as EN.
  - lbl_803D4868
  # These constants are read through offsets from sEnvMapBumpIndMtx.
  - sWarpedRingRotAxes
  - sWarpedRingIndMtx

# Retail startup/BSS bounds establish these linker-generated addresses.
# symbols_known skips signature recovery; keep the linker formulas external.
add_relocations:
- source: .text:0x8028CAE8
  type: hi
  target: _db_stack_addr
- source: .text:0x8028CAEC
  type: l
  target: _db_stack_addr
- source: .text:0x80240734
